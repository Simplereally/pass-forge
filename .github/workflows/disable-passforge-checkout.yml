name: Disable PassForge checkout

# Touching this workflow triggers it after creation.
on:
  push:
    paths:
      - .github/workflows/disable-passforge-checkout.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  disable-checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace disabled Stripe checkout link
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<a href="https://buy.stripe.com/00w5kw0KZcbl9qN9pr1gs02" class="btn btn-primary" style="text-decoration:none;text-align:center;" target="_blank">Upgrade — $1.99</a>'
          new = '<button class="btn btn-secondary" disabled title="Purchases are temporarily disabled while payment processing is reviewed.">Purchases temporarily disabled</button>'

          if old not in text:
              raise SystemExit('Expected Stripe checkout link was not found; no changes made.')

          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit checkout removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Disable public Stripe checkout link"
            git push
          fi
